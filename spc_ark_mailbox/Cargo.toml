[package]
name = "spc_ark_mailbox"
version = "0.1.0"
edition = "2021"
description = "Rotating per-epoch mailbox ids with on-demand reads for SPc + Ark (MAILBOX.md)"
license = "MIT"

[dependencies]
spc_ark = { path = "../spc_ark" }
bitcoin = { version = "0.32", features = ["rand"] }
ark-lib = "0.7.1"
# Needed for `ark::mailbox::MailboxAuthorization::new`, which takes a
# `chrono::DateTime<Local>` expiry. Same major version ark-lib uses.
chrono = "0.4"
